name: "Reusable Project Triage & Roadmap Ingestion"

on:
  workflow_call:
    inputs:
      project-url:
        description: "Full URL of the organization Project board"
        required: false
        type: string
        default: "https://github.com/orgs/glastor-core/projects/1"
      auto-label-repo:
        description: "Whether to tag issue/PR with repo:<repo_name>"
        required: false
        type: boolean
        default: true
      default-assignee:
        description: "GitHub username to auto-assign newly opened issues (empty to disable)"
        required: false
        type: string
        default: "glastor-dev"
    secrets:
      PROJECT_PAT:
        description: "Personal Access Token or GitHub App Token with project write scope"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  triage:
    name: "⚡ Triage to Public Roadmap"
    runs-on: ubuntu-latest
    # Keep the public engineering roadmap focused on core development by excluding dependabot
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Apply Repository Tag
        if: ${{ inputs.auto-label-repo }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_TAG="repo:${REPO_NAME}"
          echo "Tagging item with $REPO_TAG"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "$REPO_TAG" || true
          elif [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label "$REPO_TAG" || true
          fi

      - name: Auto-Assign New Issue
        if: ${{ github.event.issue.number != '' && inputs.default-assignee != '' && !contains(github.event.issue.labels.*.name, 'good first issue') && !contains(github.event.issue.labels.*.name, 'help wanted') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_ASSIGNEE: ${{ inputs.default-assignee }}
        run: |
          echo "Auto-assigning issue #${ISSUE_NUMBER} to ${DEFAULT_ASSIGNEE}"
          gh issue edit "$ISSUE_NUMBER" --add-assignee "$DEFAULT_ASSIGNEE" || true

      - name: Add to GLASTOR® Core Public Project Board
        uses: actions/add-to-project@v2.0.1
        continue-on-error: true
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ secrets.PROJECT_PAT || secrets.GITHUB_TOKEN }}
